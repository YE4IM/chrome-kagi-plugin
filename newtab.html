<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>正在打开主页</title>
    <style>
        body { margin: 0; min-height: 100vh; font: 15px/1.6 system-ui, sans-serif; background: #f4f5f9; color: #1c1e26; }
        main { max-width: 480px; padding: 48px 24px; margin: 0 auto; }
        h1 { font-size: 22px; }
        a, button { display: inline-block; margin: 8px 12px 8px 0; color: #4f46e5; }
        button { font: inherit; cursor: pointer; }
        a:focus-visible, button:focus-visible { outline: 3px solid #818cf8; outline-offset: 4px; }
        [hidden] { display: none !important; }
        @media (prefers-color-scheme: dark) {
            body { background: #101218; color: #eceef2; }
            a, button { color: #a5b4fc; }
        }
    </style>
    <script src="settings.js" defer></script>
    <script src="newtab.js" defer></script>
</head>
<body>
    <main id="recovery" hidden>
        <h1>打开主页</h1>
        <p id="message" role="status">正在打开主页…</p>
        <a id="target" href="https://kagi.com/">手动打开主页</a>
        <a id="settings" href="options.html">主页设置</a>
        <button type="button" id="retry">重试</button>
    </main>
    <noscript>请启用 JavaScript，或<a href="options.html">打开主页设置</a>。</noscript>
</body>
</html>
